[project]
name = "sudoku-solver-demoapp002-python-pytest"
version = "0.1.0"
description = "Python pytest-bdd Sudoku solver Stack for the shared Gherkin contract"
license = "ISC"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = [
  "coverage[toml]>=7.10,<8",
  "pip-audit>=2.9,<3",
  "pytest>=8.0",
  "pytest-bdd>=8.0",
]

[tool.setuptools.packages.find]
include = ["app_src*"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "util: shared @util Sudoku feature surface",
  "stack-demoapp002: DEMOAPP002 Python pytest Stack scenarios",
]

[tool.coverage.run]
branch = true
source = ["app_src"]
omit = [
  "*/app_src/__init__.py",
  "*/app_src/attempt.py",
  "*/app_src/audit.py",
  "*/app_src/constants.py",
]

[tool.coverage.report]
fail_under = 85
precision = 2
show_missing = true
