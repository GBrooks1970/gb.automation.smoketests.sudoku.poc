name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demoapp001-typescript-cypress:
    name: DEMOAPP001 TypeScript Cypress
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: demo-apps/demoapp001-typescript-cypress/package-lock.json

      - name: Install dependencies
        working-directory: demo-apps/demoapp001-typescript-cypress
        run: npm ci

      - name: Build
        working-directory: demo-apps/demoapp001-typescript-cypress
        run: npm run build

      - name: Lint
        working-directory: demo-apps/demoapp001-typescript-cypress
        run: npm run lint

      - name: Check formatting
        working-directory: demo-apps/demoapp001-typescript-cypress
        run: npm run format:check

      - name: API integration tests
        working-directory: demo-apps/demoapp001-typescript-cypress
        run: npm run test:api

      - name: OpenAPI contract
        working-directory: demo-apps/demoapp001-typescript-cypress
        run: npm run verify:openapi

      - name: Component coverage floor
        working-directory: demo-apps/demoapp001-typescript-cypress
        run: |
          set -o pipefail
          mkdir -p ../../.results/demoapp001/coverage
          npm run test:coverage:ci 2>&1 | tee ../../.results/demoapp001/coverage/component-coverage.txt

      - name: Test
        working-directory: demo-apps/demoapp001-typescript-cypress
        run: |
          mkdir -p ../../.results/demoapp001/test-results
          npm run test:ci

      - name: RA header currency
        shell: pwsh
        run: ./.batch/check-ra-header-currency.ps1

      - name: Memory key parity
        shell: pwsh
        run: ./.batch/check-memory-key-parity.ps1

      - name: Feature parity
        shell: pwsh
        run: ./.batch/generate-feature-parity-report.ps1

      - name: Step text parity
        shell: pwsh
        run: ./.batch/check-step-text-parity.ps1

      - name: CI evidence negative controls
        shell: pwsh
        run: ./.batch/test-ci-evidence-contract.ps1

      - name: Dependency audit policy controls
        shell: pwsh
        run: ./.batch/test-dependency-audit-policy.ps1

      - name: Dependency audit
        if: always()
        shell: pwsh
        run: ./.batch/invoke-dependency-audit.ps1 -Stack demoapp001 -EvidenceRoot .results/demoapp001

      - name: Verify DEMOAPP001 evidence
        if: always()
        shell: pwsh
        run: ./.batch/check-ci-evidence.ps1 -Stack demoapp001 -EvidenceRoot .results/demoapp001

      - name: Upload DEMOAPP001 CI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: demoapp001-ci-evidence
          path: |
            .results/demoapp001/
            .results/feature-parity/
          if-no-files-found: error
          retention-days: 7

  demoapp002-python-pytest:
    name: DEMOAPP002 Python Pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            demo-apps/demoapp002-python-pytest/pyproject.toml
            demo-apps/demoapp002-python-pytest/requirements-test.lock

      - name: Install dependencies
        working-directory: demo-apps/demoapp002-python-pytest
        run: python -m pip install -c requirements-test.lock -e ".[test]"

      - name: Component coverage floor
        working-directory: demo-apps/demoapp002-python-pytest
        run: |
          set -o pipefail
          mkdir -p ../../.results/demoapp002/coverage ../../.results/demoapp002/test-results
          python -m coverage run -m pytest tests/component
          python -m coverage report 2>&1 | tee ../../.results/demoapp002/coverage/component-coverage.txt
          python -m coverage xml -o ../../.results/demoapp002/coverage/coverage.xml

      - name: Test
        working-directory: demo-apps/demoapp002-python-pytest
        run: python -m pytest --junitxml=../../.results/demoapp002/test-results/pytest-junit.xml --cucumberjson=../../.results/demoapp002/test-results/pytest-cucumber.json

      - name: Dependency audit
        if: always()
        shell: pwsh
        run: ./.batch/invoke-dependency-audit.ps1 -Stack demoapp002 -EvidenceRoot .results/demoapp002

      - name: Verify DEMOAPP002 evidence
        if: always()
        shell: pwsh
        run: ./.batch/check-ci-evidence.ps1 -Stack demoapp002 -EvidenceRoot .results/demoapp002

      - name: Upload DEMOAPP002 CI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: demoapp002-ci-evidence
          path: .results/demoapp002/
          if-no-files-found: error
          retention-days: 7

  demoapp003-csharp-specflow:
    name: DEMOAPP003 C# Reqnroll
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        working-directory: demo-apps/demoapp003-csharp-specflow
        run: dotnet restore --locked-mode

      - name: Component coverage floor
        working-directory: demo-apps/demoapp003-csharp-specflow
        shell: pwsh
        run: |
          $evidenceRoot = '../../.results/demoapp003'
          New-Item -ItemType Directory -Path "$evidenceRoot/coverage/raw", "$evidenceRoot/test-results" -Force | Out-Null
          dotnet test tests/component/DemoApp003.ComponentTests.csproj --no-restore --collect:"XPlat Code Coverage" --settings tests/component/coverage.runsettings --logger "trx;LogFileName=component.trx" --results-directory "$evidenceRoot/coverage/raw"
          ./tooling/coverage/Write-CoverageSummary.ps1 -CoverageDirectory "$evidenceRoot/coverage/raw" -MinimumLinePercent 80 -MinimumBranchPercent 80 2>&1 | Tee-Object -FilePath "$evidenceRoot/coverage/component-coverage.txt"
          $coverage = Get-ChildItem -Path "$evidenceRoot/coverage/raw" -Recurse -Filter 'coverage.cobertura.xml' | Select-Object -First 1
          $componentTrx = Get-ChildItem -Path "$evidenceRoot/coverage/raw" -Recurse -Filter 'component.trx' | Select-Object -First 1
          Copy-Item -LiteralPath $coverage.FullName -Destination "$evidenceRoot/coverage/coverage.cobertura.xml"
          Copy-Item -LiteralPath $componentTrx.FullName -Destination "$evidenceRoot/test-results/component.trx"

      - name: Reqnroll test
        working-directory: demo-apps/demoapp003-csharp-specflow
        run: dotnet test tests/DemoApp003.Specs.csproj --no-restore --logger "trx;LogFileName=reqnroll.trx" --results-directory ../../.results/demoapp003/test-results

      - name: Keep Reqnroll Cucumber Messages as evidence
        if: always()
        shell: pwsh
        working-directory: demo-apps/demoapp003-csharp-specflow
        run: |
          # tests/reqnroll.json enables the message formatter; it writes under the test output folder.
          $messages = Get-ChildItem -Path tests/bin -Recurse -Filter 'reqnroll.ndjson' | Select-Object -First 1
          if ($null -eq $messages) { Write-Error 'Reqnroll did not write reqnroll.ndjson'; exit 1 }
          Copy-Item -LiteralPath $messages.FullName -Destination '../../.results/demoapp003/test-results/reqnroll.ndjson'

      - name: Dependency audit
        if: always()
        shell: pwsh
        run: ./.batch/invoke-dependency-audit.ps1 -Stack demoapp003 -EvidenceRoot .results/demoapp003

      - name: Verify DEMOAPP003 evidence
        if: always()
        shell: pwsh
        run: ./.batch/check-ci-evidence.ps1 -Stack demoapp003 -EvidenceRoot .results/demoapp003

      - name: Upload DEMOAPP003 CI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: demoapp003-ci-evidence
          path: .results/demoapp003/
          if-no-files-found: error
          retention-days: 7

  parity:
    # Results-level parity (DR-047): reads what each Stack actually executed, runs the gate on it, and builds the
    # parity evidence page with its negative check. Runs on pull requests too, so a PR proves the page still builds;
    # only the pages-* jobs below publish, and only from main.
    name: Parity gate and evidence page
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - demoapp001-typescript-cypress
      - demoapp002-python-pytest
      - demoapp003-csharp-specflow

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # The DEMOAPP001 artefact uploads two paths, so it unpacks as demoapp001/ and feature-parity/ under .results.
      - name: Download DEMOAPP001 evidence
        uses: actions/download-artifact@v7
        with:
          name: demoapp001-ci-evidence
          path: .results

      - name: Download DEMOAPP002 evidence
        uses: actions/download-artifact@v7
        with:
          name: demoapp002-ci-evidence
          path: .results/demoapp002

      - name: Download DEMOAPP003 evidence
        uses: actions/download-artifact@v7
        with:
          name: demoapp003-ci-evidence
          path: .results/demoapp003

      - name: Parity tool tests
        run: node --test tools/parity-page/tests/*.test.mjs

      - name: Results-level parity gate
        run: node tools/parity-page/check-parity.mjs

      - name: Build the parity evidence page (includes the negative check)
        run: node tools/parity-page/build-page.mjs --out parity-page-dist

      - name: Upload parity evidence page
        uses: actions/upload-artifact@v7
        with:
          name: parity-page
          path: parity-page-dist/
          if-no-files-found: error
          retention-days: 7

  gate:
    name: Gate (all stacks green)
    runs-on: ubuntu-latest
    needs:
      - demoapp001-typescript-cypress
      - demoapp002-python-pytest
      - demoapp003-csharp-specflow
      - parity

    steps:
      - name: All stacks green and parity verified
        run: echo "all stacks green and parity verified"

  pages-build:
    # Assembles one Pages artefact: the DEMOAPP001 static visualisation (BACKLOG-071 / DR-040, built exactly as the
    # former pages.yml did, drift check included) with the parity page under /parity/. Runs after the gate, never on
    # pull requests, and holds no Pages permissions. Runs on manual dispatch from any ref so it can be dry-run
    # without deploying; only pages-deploy publishes.
    name: Build static evidence site
    needs: gate
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: demo-apps/demoapp001-typescript-cypress

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: demo-apps/demoapp001-typescript-cypress/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check the static evidence site (drift + self-containment)
        run: node scripts/check-pages.cjs

      - name: Assemble the static evidence site
        run: node scripts/build-pages.cjs

      - name: Add the parity evidence page under /parity/
        uses: actions/download-artifact@v7
        with:
          name: parity-page
          path: demo-apps/demoapp001-typescript-cypress/pages-dist/parity

      - name: Check both pages are present
        run: |
          test -f pages-dist/index.html
          test -f pages-dist/parity/index.html
          ls -la pages-dist pages-dist/parity

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: demo-apps/demoapp001-typescript-cypress/pages-dist

  pages-deploy:
    # Only the deploy job holds Pages write and id-token. Publishes only from main, and only after the gate and the
    # site build both succeeded, so the public pages never show a red build as the project's evidence.
    name: Deploy to GitHub Pages
    needs: pages-build
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
