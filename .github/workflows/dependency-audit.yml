name: Dependency audit

# Weekly DR-039 dependency audit for all three Stacks (BACKLOG-083 / DR-048). Audit only: it uses the same locked
# restores, scripts and policy as ci.yml, so an expired exception or a new advisory turns this run red within a
# week instead of waiting for the next pull request. It holds read-only permissions and no Pages job, environment
# or action, so it can never deploy Pages. The pull_request trigger fires only when this file changes, so the PR
# that changes the workflow proves it.

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/dependency-audit.yml

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    name: Audit ${{ matrix.stack }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        stack:
          - demoapp001
          - demoapp002
          - demoapp003

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        if: matrix.stack == 'demoapp001'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: demo-apps/demoapp001-typescript-cypress/package-lock.json

      - name: Install DEMOAPP001 dependencies
        if: matrix.stack == 'demoapp001'
        working-directory: demo-apps/demoapp001-typescript-cypress
        run: npm ci

      - name: Setup Python
        if: matrix.stack == 'demoapp002'
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            demo-apps/demoapp002-python-pytest/pyproject.toml
            demo-apps/demoapp002-python-pytest/requirements-test.lock

      - name: Install DEMOAPP002 dependencies
        if: matrix.stack == 'demoapp002'
        working-directory: demo-apps/demoapp002-python-pytest
        run: python -m pip install -c requirements-test.lock -e ".[test]"

      - name: Setup .NET
        if: matrix.stack == 'demoapp003'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore DEMOAPP003
        if: matrix.stack == 'demoapp003'
        working-directory: demo-apps/demoapp003-csharp-specflow
        run: dotnet restore --locked-mode

      - name: Dependency audit
        shell: pwsh
        run: ./.batch/invoke-dependency-audit.ps1 -Stack ${{ matrix.stack }} -EvidenceRoot .results/${{ matrix.stack }}

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-audit-${{ matrix.stack }}
          path: .results/${{ matrix.stack }}/audit/
          if-no-files-found: error
          retention-days: 7
